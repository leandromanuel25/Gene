<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gene Vision - Genomic Dashboard</title>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Three.js -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #0d1220;
            --bg-panel: rgba(13, 18, 32, 0.85);
            --border-color: rgba(100, 80, 255, 0.2);
            --neon-blue: #00d4ff;
            --neon-purple: #a855f7;
            --neon-pink: #e879f9;
            --neon-cyan: #22d3ee;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #root { width: 100%; height: 100%; }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .glass-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            opacity: 0.5;
        }

        .glow-blue {
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15), inset 0 0 20px rgba(0, 212, 255, 0.05);
        }

        .glow-purple {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.15), inset 0 0 20px rgba(168, 85, 247, 0.05);
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            background: linear-gradient(180deg, rgba(10,14,26,0.98) 0%, rgba(13,18,32,0.95) 100%);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin: 2px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .sidebar-item:hover {
            background: rgba(168, 85, 247, 0.1);
            color: var(--text-primary);
        }

        .sidebar-item.active {
            background: linear-gradient(90deg, rgba(168, 85, 247, 0.2), rgba(0, 212, 255, 0.1));
            color: var(--neon-blue);
            border-left: 2px solid var(--neon-blue);
        }

        .header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(10, 14, 26, 0.9);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        #dna-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .grid-overlay {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 200px;
            background: 
                linear-gradient(90deg, transparent 49%, rgba(0,212,255,0.1) 50%, transparent 51%),
                linear-gradient(0deg, transparent 49%, rgba(168,85,247,0.1) 50%, transparent 51%);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
            pointer-events: none;
            z-index: 2;
        }

        .particles {
            position: absolute;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .particle {
            position: absolute;
            width: 3px; height: 3px;
            border-radius: 50%;
            box-shadow: 0 0 6px var(--neon-blue);
            animation: float 4s ease-in-out infinite;
        }

        .circular-progress {
            position: relative;
            width: 50px; height: 50px;
        }

        .circular-progress svg { transform: rotate(-90deg); }

        .circular-progress .track {
            fill: none;
            stroke: rgba(168, 85, 247, 0.1);
            stroke-width: 4;
        }

        .circular-progress .progress {
            fill: none;
            stroke: url(#gradientPurple);
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease;
        }

        .btn-neon {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(0, 212, 255, 0.2));
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: var(--text-primary);
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-neon:hover {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(0, 212, 255, 0.3));
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            transform: translateY(-1px);
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
            animation: pulse-glow 2s infinite;
        }

        .data-card { padding: 16px; position: relative; }

        .data-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .data-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .data-value.accent {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .data-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .sparkline {
            width: 100%;
            height: 40px;
        }

        .hexagon {
            position: absolute;
            width: 60px; height: 60px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--neon-blue);
            background: rgba(0, 212, 255, 0.05);
        }

        .ai-badge {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(0, 212, 255, 0.3));
            border: 2px solid rgba(168, 85, 247, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <linearGradient id="gradientBlue" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#0080ff;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="gradientPurple" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#e879f9;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="gradientMixed" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
                <stop offset="50%" style="stop-color:#a855f7;stop-opacity:0.8" />
                <stop offset="100%" style="stop-color:#e879f9;stop-opacity:0.8" />
            </linearGradient>
        </defs>
    </svg>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Icons
        const Icons = {
            Menu: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>,
            Home: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Dna: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m2 15c6.667-6 13.333 0 20-6"/><path d="m2 9c6.667 6 13.333 0 20 6"/><path d="M12 3v18"/><path d="M5 3v18"/><path d="M19 3v18"/></svg>,
            Activity: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            Database: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>,
            Layers: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>,
            Network: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="5" cy="6" r="3"/><path d="M5 9v6"/><circle cx="5" cy="18" r="3"/><path d="M12 3v18"/><circle cx="19" cy="6" r="3"/><path d="M16 15.5A9 9 0 0 0 19 9"/><circle cx="19" cy="18" r="3"/></svg>,
            Settings: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            Bell: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>,
            User: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Search: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            Plus: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            X: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            TrendingUp: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>,
            Brain: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>,
            AlertTriangle: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            Zap: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
            Shield: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
            Clock: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            ExternalLink: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>,
            ChevronDown: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m6 9 6 6 6-6"/></svg>,
        };

        // Sparkline Component
        const Sparkline = ({ data, color = "#00d4ff", fill = true, height = 40 }) => {
            const max = Math.max(...data);
            const min = Math.min(...data);
            const range = max - min || 1;
            const points = data.map((v, i) => {
                const x = (i / (data.length - 1)) * 100;
                const y = 100 - ((v - min) / range) * 80 - 10;
                return `${x},${y}`;
            }).join(' ');
            const fillPoints = `0,100 ${points} 100,100`;
            const gradId = `grad-${color.replace('#','').replace(/[^a-zA-Z0-9]/g,'')}`;

            return (
                <svg className="sparkline" viewBox="0 0 100 100" preserveAspectRatio="none" style={{height}}>
                    <defs>
                        <linearGradient id={gradId} x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style={{stopColor: color, stopOpacity: 0.3}} />
                            <stop offset="100%" style={{stopColor: color, stopOpacity: 0}} />
                        </linearGradient>
                    </defs>
                    {fill && <polygon points={fillPoints} fill={`url(#${gradId})`} />}
                    <polyline points={points} fill="none" stroke={color} strokeWidth="2" vectorEffect="non-scaling-stroke" />
                </svg>
            );
        };

        // Circular Progress
        const CircularProgress = ({ value, size = 50, strokeWidth = 4 }) => {
            const radius = (size - strokeWidth) / 2;
            const circumference = radius * 2 * Math.PI;
            const offset = circumference - (value / 100) * circumference;

            return (
                <div className="circular-progress" style={{width: size, height: size}}>
                    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
                        <circle className="track" cx={size/2} cy={size/2} r={radius} />
                        <circle className="progress" cx={size/2} cy={size/2} r={radius}
                            strokeDasharray={circumference} strokeDashoffset={offset} />
                    </svg>
                    <div style={{position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)',
                        fontSize: '11px', fontWeight: '700', fontFamily: 'JetBrains Mono, monospace', color: '#a855f7'}}>
                        {value}%
                    </div>
                </div>
            );
        };

        // DNA 3D Visualization
        const DnaVisualization = () => {
            const containerRef = useRef(null);
            const rendererRef = useRef(null);
            const frameRef = useRef(null);

            useEffect(() => {
                if (!containerRef.current) return;
                const container = containerRef.current;
                const width = container.clientWidth;
                const height = container.clientHeight;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
                camera.position.set(0, 2, 12);
                camera.lookAt(0, 0, 0);

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.setClearColor(0x000000, 0);
                container.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                const dnaGroup = new THREE.Group();
                scene.add(dnaGroup);

                const helixHeight = 14;
                const turns = 3;
                const basePairsPerTurn = 20;
                const totalBasePairs = turns * basePairsPerTurn;
                const radius = 2.2;

                const strandMaterial1 = new THREE.MeshStandardMaterial({
                    color: 0x00d4ff, emissive: 0x0088ff, emissiveIntensity: 0.6,
                    metalness: 0.8, roughness: 0.2, transparent: true, opacity: 0.9
                });

                const strandMaterial2 = new THREE.MeshStandardMaterial({
                    color: 0xe879f9, emissive: 0xaa44dd, emissiveIntensity: 0.6,
                    metalness: 0.8, roughness: 0.2, transparent: true, opacity: 0.9
                });

                const baseMaterial = new THREE.MeshStandardMaterial({
                    color: 0x22d3ee, emissive: 0x1188aa, emissiveIntensity: 0.4,
                    metalness: 0.5, roughness: 0.3, transparent: true, opacity: 0.6
                });

                const baseMaterial2 = new THREE.MeshStandardMaterial({
                    color: 0xa855f7, emissive: 0x6633aa, emissiveIntensity: 0.4,
                    metalness: 0.5, roughness: 0.3, transparent: true, opacity: 0.6
                });

                const strandPoints1 = [];
                const strandPoints2 = [];

                for (let i = 0; i <= totalBasePairs; i++) {
                    const t = i / totalBasePairs;
                    const angle = t * Math.PI * 2 * turns;
                    const y = (t - 0.5) * helixHeight;
                    strandPoints1.push(new THREE.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius));
                    strandPoints2.push(new THREE.Vector3(Math.cos(angle + Math.PI) * radius, y, Math.sin(angle + Math.PI) * radius));
                }

                const curve1 = new THREE.CatmullRomCurve3(strandPoints1);
                const tubeGeometry1 = new THREE.TubeGeometry(curve1, 200, 0.08, 8, false);
                dnaGroup.add(new THREE.Mesh(tubeGeometry1, strandMaterial1));

                const curve2 = new THREE.CatmullRomCurve3(strandPoints2);
                const tubeGeometry2 = new THREE.TubeGeometry(curve2, 200, 0.08, 8, false);
                dnaGroup.add(new THREE.Mesh(tubeGeometry2, strandMaterial2));

                const basePairs = [];
                for (let i = 0; i < totalBasePairs; i++) {
                    const t = i / totalBasePairs;
                    const angle = t * Math.PI * 2 * turns;
                    const y = (t - 0.5) * helixHeight;
                    const x1 = Math.cos(angle) * radius, z1 = Math.sin(angle) * radius;
                    const x2 = Math.cos(angle + Math.PI) * radius, z2 = Math.sin(angle + Math.PI) * radius;
                    const midX = (x1 + x2) / 2, midZ = (z1 + z2) / 2;
                    const dist = Math.sqrt((x2-x1)**2 + (z2-z1)**2);

                    const baseGeo = new THREE.CylinderGeometry(0.04, 0.04, dist, 6);
                    baseGeo.rotateZ(Math.PI / 2);
                    const baseMesh = new THREE.Mesh(baseGeo, i % 2 === 0 ? baseMaterial : baseMaterial2);
                    baseMesh.position.set(midX, y, midZ);
                    baseMesh.lookAt(x2, y, z2);
                    baseMesh.rotateY(Math.PI / 2);
                    dnaGroup.add(baseMesh);
                    basePairs.push(baseMesh);

                    const sphereGeo = new THREE.SphereGeometry(0.15, 8, 8);
                    dnaGroup.add(new THREE.Mesh(sphereGeo, strandMaterial1)).position.set(x1, y, z1);
                    dnaGroup.add(new THREE.Mesh(sphereGeo, strandMaterial2)).position.set(x2, y, z2);
                }

                const particleCount = 200;
                const particleGeo = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const r = radius + (Math.random() - 0.5) * 6;
                    const y = (Math.random() - 0.5) * helixHeight * 1.5;
                    positions[i * 3] = Math.cos(theta) * r;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = Math.sin(theta) * r;
                    const isBlue = Math.random() > 0.5;
                    colors[i * 3] = isBlue ? 0.0 : 0.65;
                    colors[i * 3 + 1] = isBlue ? 0.83 : 0.33;
                    colors[i * 3 + 2] = isBlue ? 1.0 : 0.97;
                }

                particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const particleMaterial = new THREE.PointsMaterial({
                    size: 0.08, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending
                });
                const particles = new THREE.Points(particleGeo, particleMaterial);
                dnaGroup.add(particles);

                scene.add(new THREE.AmbientLight(0x404080, 0.5));
                const blueLight = new THREE.PointLight(0x00d4ff, 2, 20);
                blueLight.position.set(5, 5, 5);
                scene.add(blueLight);
                const purpleLight = new THREE.PointLight(0xa855f7, 2, 20);
                purpleLight.position.set(-5, -5, 5);
                scene.add(purpleLight);
                scene.add(new THREE.PointLight(0xffffff, 0.5, 15)).position.set(0, 0, 8);

                const platformGeo = new THREE.CylinderGeometry(3.5, 4, 0.2, 64);
                const platformMat = new THREE.MeshStandardMaterial({
                    color: 0x0a0e1a, emissive: 0x00d4ff, emissiveIntensity: 0.2,
                    metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.8
                });
                const platform = new THREE.Mesh(platformGeo, platformMat);
                platform.position.y = -helixHeight / 2 - 0.5;
                dnaGroup.add(platform);

                const ringGeo = new THREE.TorusGeometry(3.5, 0.05, 16, 100);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: 0x00d4ff, emissive: 0x00d4ff, emissiveIntensity: 1, transparent: true, opacity: 0.6
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.y = -helixHeight / 2 - 0.4;
                ring.rotation.x = Math.PI / 2;
                dnaGroup.add(ring);

                const ring2 = new THREE.Mesh(ringGeo, ringMat);
                ring2.position.y = -helixHeight / 2 - 0.4;
                ring2.rotation.x = Math.PI / 2;
                ring2.scale.set(1.2, 1.2, 1);
                dnaGroup.add(ring2);

                let time = 0;
                const animate = () => {
                    frameRef.current = requestAnimationFrame(animate);
                    time += 0.005;
                    dnaGroup.rotation.y = time * 0.5;
                    dnaGroup.position.y = Math.sin(time * 0.8) * 0.3;

                        const pulse = Math.sin(time * 2 + i * 0.3) * 0.3 + 0.7;

                    });
                    particles.rotation.y = -time * 0.2;
                    ring.rotation.z = time * 0.3;
                    ring2.rotation.z = -time * 0.2;
                    renderer.render(scene, camera);
